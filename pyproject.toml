[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dev-isolator"
version = "0.0.2"
description = "Podman-based per-project development environment manager"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
dependencies = [
    "podman",
    "pyyaml",
    "jinja2",
    "tree-sitter",
    "tree-sitter-containerfile"
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
dev-isolator = "dev_isolator.main:main"
di = "dev_isolator.main:main"

[project.urls]
Homepage = "https://gitlab.mpi-magdeburg.mpg.de/software/dev-isolator"
Issues = "https://gitlab.mpi-magdeburg.mpg.de/software/dev-isolator/-/work_items"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dev_isolator = [
    "data/*",
    "data/*/*",
    "data/*/*/*",
]

